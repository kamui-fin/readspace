# Base docker-compose template

x-server-build: &server-build
  context: ${PROJECT_ROOT}/server
  dockerfile: Dockerfile

# Shared by api / worker / scheduler. server/.env (generated by setup.sh) supplies the
# optional settings (AI, RSSHub, ...); the explicit `environment` below wins over it and
# pins the in-network addresses, so a dev-mode server/.env can't point containers at localhost.
x-server-env-file: &server-env-file
  - path: ${PROJECT_ROOT}/server/.env
    required: false

x-server-env: &server-env
  ENVIRONMENT: production
  PYTHONUNBUFFERED: "1"
  REDIS_URL: redis://redis:6379/0
  SUPABASE_URL: http://kong:8000
  SUPABASE_ANON_KEY: ${ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
  SUPABASE_JWT_SECRET: ${JWT_SECRET}
  # API uses Supavisor session mode (5432); workers use transaction mode (6543)
  DATABASE_URL_API: postgresql://postgres.${POOLER_TENANT_ID}:${POSTGRES_PASSWORD}@supavisor:5432/postgres
  DATABASE_URL_WORKER: postgresql://postgres.${POOLER_TENANT_ID}:${POSTGRES_PASSWORD}@supavisor:6543/postgres
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
  MEILISEARCH_INDEX_NAME: feeds
  # Required: CORSMiddleware combines this with allow_credentials=True, and a
  # wildcard origin (the app default) is invalid for credentialed requests per
  # the CORS spec — browsers reject it client-side regardless of server intent.
  CORS_ORIGIN: ${WEB_URL}

services:
  # Override of the vendored supabase/docker-compose.yml service (Compose merges healthcheck
  # keys across -f files, so test/interval/retries stay upstream's). storage-api runs its
  # tenant migrations against Postgres before it listens on :5000, and upstream sets no
  # start_period — so the 3 x 5s probes elapse ~30s after start and Compose marks it
  # unhealthy. On a first `launch.sh`, image builds saturate the disk, storage loses that
  # race, and every app service gated on `storage: service_healthy` is left in Created.
  storage:
    healthcheck:
      start_period: 120s

  redis:
    image: redis:alpine
    container_name: readspace_redis
    restart: always
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: readspace_meilisearch
    restart: always
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    # Published on all interfaces on purpose: browsers query Meilisearch directly with the
    # search-only key. production mode disables the dashboard and refuses to start without a
    # master key of 16+ bytes (setup.sh generates one); launch.sh --dev switches to development.
    environment:
      - MEILI_ENV=${MEILI_ENV:-production}
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILI_HTTP_ADDR=0.0.0.0:7700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    profiles: ["app"]
    build:
      context: ${PROJECT_ROOT}
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they go in as build
      # args; changing a URL in docker/.env triggers a rebuild on the next `launch.sh`.
      args: &web-public-env
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:18000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:-http://localhost:18008}
        NEXT_PUBLIC_APP_URL: ${WEB_URL:-http://localhost:18042}
        NEXT_PUBLIC_MEILISEARCH_URL: ${MEILISEARCH_PUBLIC_URL:-http://localhost:7700}
        NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: ${MEILISEARCH_SEARCH_KEY}
    container_name: readspace_web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    ports:
      - "18042:8042"
    # Same values at runtime for server-side code
    environment: *web-public-env
    depends_on:
      - api
      - meilisearch

  # api is the only service that builds readspace-server:local; worker and scheduler run
  # the same image (pull_policy: never), so `up --build` produces exactly one image
  # instead of three identical per-service copies.
  api:
    profiles: ["app"]
    image: readspace-server:local
    build: *server-build
    container_name: readspace_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python scripts/init_meilisearch.py &&
             python scripts/init_storage.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8008"
    ports:
      - "18008:8008"
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      # The app connects through Supavisor, not db directly — waiting on db alone races
      # the pooler on first boot (ConnectionRefused on supavisor:5432).
      supavisor:
        condition: service_healthy
      # scripts/init_storage.py creates the favicons bucket through Kong -> Storage
      kong:
        condition: service_healthy
      storage:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: *server-env-file
    environment:
      <<: *server-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Migrations + Meilisearch index setup run before uvicorn starts
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    profiles: ["app"]
    image: readspace-server:local
    pull_policy: never
    container_name: readspace_worker
    restart: unless-stopped
    command: taskiq worker app.core.taskiq_app:broker app.workers.registry --max-async-tasks 200
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      supavisor:
        condition: service_healthy
      # Ensures the image api builds exists before this container is created, and that
      # migrations have run before tasks touch the schema.
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: *server-env-file
    environment:
      <<: *server-env

  scheduler:
    profiles: ["app"]
    image: readspace-server:local
    pull_policy: never
    container_name: readspace_scheduler
    restart: unless-stopped
    command: taskiq scheduler app.core.taskiq_app:scheduler app.workers.registry
    depends_on:
      redis:
        condition: service_healthy
      supavisor:
        condition: service_healthy
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: *server-env-file
    environment:
      <<: *server-env

  # RSSHub for generating RSS feeds from sites that don't provide them
  # Enable with: docker compose ... --profile rsshub up
  browserless:
    profiles: ["rsshub"]
    image: browserless/chrome
    container_name: readspace_browserless
    restart: always
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3

  rsshub:
    profiles: ["rsshub"]
    image: diygod/rsshub
    container_name: readspace_rsshub
    restart: always
    ports:
      - "1200:1200"
    depends_on:
      redis:
        condition: service_healthy
      browserless:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
      CACHE_EXPIRE: 3600
      CACHE_CONTENT_EXPIRE: 86400
      MEMORY_MAX: 1024
      PUPPETEER_WS_ENDPOINT: "ws://browserless:3000"
      ALLOW_ORIGIN: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  meilisearch-data:
