# Base docker-compose template

services:
  redis:
    image: redis:alpine
    container_name: readspace_redis
    restart: always
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: readspace_meilisearch
    restart: always
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-readspace_master_key_change_in_production}
      - MEILI_HTTP_ADDR=0.0.0.0:7700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: readspace_web
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    ports:
      - "18042:8042"
    environment:
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_PUBLIC_URL:-http://localhost:18000}
      - NEXT_PUBLIC_API_BASE_URL=${API_URL:-http://localhost:18008}
      - NEXT_PUBLIC_MEILISEARCH_URL=${MEILISEARCH_PUBLIC_URL:-http://localhost:7700}
      - NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY=${MEILISEARCH_SEARCH_KEY}
    depends_on:
      - api
      - meilisearch

  api:
    profiles: ["app"]
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_api
    command: >
      sh -c "alembic upgrade head &&
             python scripts/init_meilisearch.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8008"
    ports:
      - "18008:8008"
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ../server:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_DB_CONNECTION=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILISEARCH_INDEX_NAME=feeds
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  worker:
    profiles: ["app"]
    build:
      context: ../server
      dockerfile: Dockerfile.taskiq
    container_name: readspace_worker
    command: taskiq worker app.core.taskiq_app:broker app.workers.registry --max-async-tasks 200
    volumes:
      - ../server:/app
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGIN=http://web:8042
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_DB_CONNECTION=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILISEARCH_INDEX_NAME=feeds
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

  scheduler:
    profiles: ["app"]
    build:
      context: ../server
      dockerfile: Dockerfile.taskiq
    container_name: readspace_scheduler
    command: taskiq scheduler app.core.taskiq_app:scheduler app.workers.registry
    volumes:
      - ../server:/app
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGIN=http://web:8042
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_DB_CONNECTION=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

  # RSSHub for generating RSS feeds from sites that don't provide them
  # Enable with: docker compose ... --profile rsshub up
  browserless:
    profiles: ["rsshub"]
    image: browserless/chrome
    container_name: readspace_browserless
    restart: always
    ulimits:
      core:
        hard: 0
        soft: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3

  rsshub:
    profiles: ["rsshub"]
    image: diygod/rsshub
    container_name: readspace_rsshub
    restart: always
    ports:
      - "1200:1200"
    depends_on:
      redis:
        condition: service_healthy
      browserless:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://redis:6379/"
      CACHE_EXPIRE: 3600
      CACHE_CONTENT_EXPIRE: 86400
      MEMORY_MAX: 1024
      PUPPETEER_WS_ENDPOINT: "ws://browserless:3000"
      ALLOW_ORIGIN: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  meilisearch-data:
