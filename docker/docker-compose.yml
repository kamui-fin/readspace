# Base docker-compose template

services:
  redis:
    image: redis:alpine
    container_name: readspace_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
        - redis-data:/data
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 5s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: readspace_web
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    ports:
      - "18042:8042"
    environment:
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:18000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:18008
    depends_on:
      - api

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8008"
    ports:
      - "18008:8008"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../server:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_DB_CONNECTION=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_worker
    command: celery -A app.core.celery_app  worker -l info
    volumes:
      - ../server:/app
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGIN=http://web:8042
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_DB_CONNECTION=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

  beat:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_beat
    command: celery -A app.core.celery_app beat -l info
    volumes:
      - ../server:/app
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGIN=http://web:8042
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://kong:18000
      - SUPABASE_DB_CONNECTION=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

volumes:
    redis-data:

networks:
  default:
    name: readspace_shared_net
    external: true
