<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Notification: Password Changed</title>
  <!-- Load Brand Fonts from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #191919 !important;
        color: #e5e5e5 !important;
      }
      .logo-text {
        color: #ffffff !important;
      }
      .body-text {
        color: #e5e5e5 !important;
      }
      .divider {
        border-color: #2d2d2d !important;
      }
      .helper-text {
        color: #a5a5a5 !important;
      }
      .fallback-link {
        color: #6a994e !important;
      }
    }
  </style>
</head>
<body style="font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #ffffff; padding: 40px 20px; color: #232222; margin: 0; -webkit-font-smoothing: antialiased;">
  
  <div style="max-width: 440px; margin: 0 auto; text-align: left;">
    
    <!-- Header -->
    <div style="margin-bottom: 40px; font-size: 0; line-height: 0;">
      <img src="https://app.readspace.ai/readspace.svg" alt="Readspace Icon" style="width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; margin-right: 8px; border: 0; outline: none; text-decoration: none;" />
      <span class="logo-text" style="font-family: 'Figtree', -apple-system, sans-serif; font-size: 20px; font-weight: 700; color: #232222; vertical-align: middle; letter-spacing: -0.03em; text-transform: lowercase;">
        readspace
      </span>
    </div>
    
    <!-- Body Content -->
    <p class="body-text" style="font-size: 15px; line-height: 24px; color: #232222; margin-top: 0; margin-bottom: 16px; font-weight: 500;">
      Hi {{ .Data.display_name }},
    </p>
    <p class="body-text" style="font-size: 15px; line-height: 24px; color: #232222; margin-top: 0; margin-bottom: 24px; font-weight: 400; letter-spacing: -0.01em;">
      This is a security notification to inform you that your password has been changed.
    </p>
    <p class="body-text" style="font-size: 15px; line-height: 24px; color: #232222; margin-top: 0; margin-bottom: 32px; font-weight: 400; letter-spacing: -0.01em;">
      If you didn't make this change, please contact us immediately to secure your account.
    </p>

    <hr class="divider" style="border: 0; border-top: 1px solid #e2e3e3; margin: 32px 0;">

    <!-- Footer -->
    <p class="helper-text" style="font-size: 12px; color: #9fa2a0; line-height: 18px; margin: 0 0 4px 0; font-weight: 400;">
      Need help? Contact <a href="mailto:support@readspace.ai" style="color: #386641; text-decoration: none;" class="fallback-link">support@readspace.ai</a>
    </p>
    <p class="helper-text" style="font-size: 12px; color: #9fa2a0; line-height: 18px; margin: 0; font-weight: 500;">
      Thanks,<br>Readspace Team
    </p>
  </div>

</body>
</html>
