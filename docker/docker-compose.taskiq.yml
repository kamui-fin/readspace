# For Coolify deployment
# Taskiq worker and scheduler services

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: readspace_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
    networks:
      - coolify

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_worker
    # Single worker with async concurrency (--max-async-tasks controls concurrent task limit)
    command: taskiq worker app.core.taskiq_app:broker --fs-discover --tasks-pattern "app/workers/*.py" --max-async-tasks 200
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      # SUPABASE_DB_CONNECTION configured via Coolify dashboard
      # Production (Supabase Cloud): Use port 6543 (transaction mode)
      # Local/Self-hosted: Use port 5432 (session mode)
    networks:
      - coolify

  scheduler:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_scheduler
    command: taskiq scheduler app.core.taskiq_app:scheduler --fs-discover --tasks-pattern "app/workers/*.py"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    networks:
      - coolify

volumes:
  rabbitmq-data:

networks:
  coolify:
    name: coolify
    external: true
