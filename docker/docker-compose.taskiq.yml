# For Coolify deployment
# Taskiq worker and scheduler services

services:

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_worker
    command: taskiq worker app.core.taskiq_app:broker app.workers.registry --max-async-tasks 200
    restart: on-failure
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - coolify

  scheduler:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_scheduler
    command: taskiq scheduler app.core.taskiq_app:scheduler app.workers.registry 
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - coolify


networks:
  coolify:
    name: coolify
    external: true
