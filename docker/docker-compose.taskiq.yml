# For Coolify deployment
# Taskiq worker and scheduler services

services:
  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_worker
    command: taskiq worker app.core.taskiq_app:broker --fs-discover --tasks-pattern "app/workers/*.py"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - coolify

  scheduler:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: readspace_scheduler
    command: taskiq scheduler app.core.taskiq_app:scheduler --fs-discover --tasks-pattern "app/workers/*.py"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: true
