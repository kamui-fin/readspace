[project]
name = "readspace-server"
version = "0.1.0"
description = ""
authors = [
    {name = "Kamui",email = "fin-kamui@pm.me"}
]
readme = "README.md"
requires-python = ">=3.10,<=3.13.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "readspace-server"
description = ""
version = "0.1.0"
authors = [
    "Kamui <fin-kamui@pm.me>"
]
readme = "README.md"
packages = [
    {include = "app",from = "."}
]

[tool.poe.tasks]
start = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8008"
test = "pytest tests/"
test-unit = "pytest tests/unit/ -m unit"
test-integration = "pytest tests/integration/ -m integration"
test-coverage = "pytest tests/ --cov=app --cov-report=html --cov-report=term-missing"
type-check = "mypy app/"
lint = "ruff check app --fix"
format = "ruff format app"
migrate = "alembic upgrade head"

[tool.poetry.dependencies]
fastapi = {extras = ["all"], version = "^0.115.12"}
uvicorn = "^0.34.0"
orjson = "^3.9.13"
pydantic = "^2.9.2"
pydantic-settings = "^2.8.1"
python-dotenv = "^1.0.1"
python-jose = "^3.3.0"
requests = "^2.31.0"
httpx = "^0.28.1"
iso639-lang = "^2.3.1"
ebooklib = "^0.18"
supabase = "^2.15.0"
asyncpg = "^0.30.0"
posthog = "^3.24.1"
structlog = "^25.2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"
opml = "^0.5"
feedparser = "^6.0.11"
celery = {extras = ["redis"], version = "^5.5.2"}
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-asyncio = "^0.26.0"
factory-boy = "^3.3.3"
sqlalchemy-utils = "^0.41.2"
gevent = "^25.5.1"
bs4 = "^0.0.2"
psycopg2-binary = "^2.9.10"
beautifulsoup4 = "^4.13.4"
openai = "^1.106.1"
extract-favicon = "^0.5.3"
lingua-language-detector = "^2.1.1"
pgvector = "^0.4.1"
google-genai = "^1.35.0"
trafilatura = "^1.12.2"
python-logging-loki = "^0.3.1"
python-json-logger = "^3.3.0"
opentelemetry-api = "^1.30.0"
opentelemetry-sdk = "^1.30.0"
opentelemetry-exporter-otlp = "^1.30.0"
opentelemetry-instrumentation = "^0.51b0"
opentelemetry-instrumentation-fastapi = "^0.51b0"
opentelemetry-instrumentation-sqlalchemy = "^0.51b0"
opentelemetry-instrumentation-redis = "^0.51b0"
opentelemetry-instrumentation-httpx = "^0.51b0"
opentelemetry-instrumentation-logging = "^0.51b0"
opentelemetry-instrumentation-celery = "^0.51b0"
prometheus-client = "^0.21.0"
prometheus-fastapi-instrumentator = "^7.0.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pre-commit = "^4.1.0"
bandit = "^1.8.3"
types-requests = "^2.32.0.20250306"
safety = "^3.3.1"
poethepoet = "^0.33.1"
ruff = "^0.11.5"
types-python-jose = "^3.5.0.20250531"
pytest-mock = "^3.15.1"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "S",  # bandit security
]
ignore = [
    "B008", # do not perform function calls in argument defaults
    "S101", # use of assert for tests
    "S603", # subprocess call without shell=False
    "S607", # subprocess call with shell=True
    "N818", # Exception name should have Error suffix (custom exceptions are OK)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S106", "S113"]  # Allow assert, hardcoded secrets in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Enable gradually
disallow_any_unimported = true
no_implicit_reexport = true
no_implicit_optional = true
show_error_codes = true

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
