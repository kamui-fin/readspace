[pytest]
# Pytest configuration for E2E tests

# Test discovery
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_redis: marks tests that require Redis
    requires_celery: marks tests that require Celery

# Output options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --color=yes

# Async support
asyncio_mode = auto

# Coverage options (when using --cov)
[coverage:run]
source = app.routers
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
